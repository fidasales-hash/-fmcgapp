openapi: 3.1.0
info:
  title: Clearance Shop Lister
  description: Adds a product listing to the Clearance Shop JHB store.
  version: 1.0.0
servers:
  - url: https://clearanceshop.co.za
paths:
  /api/gpt/products:
    post:
      operationId: createProduct
      summary: Publish a new product to the store
      description: >-
        Creates a product with photos and listing details. Call only after the
        user has confirmed the listing. Attach the product photos the user sent
        in this chat (front of pack first).
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price, category, openaiFileIdRefs]
              properties:
                name:
                  type: string
                  description: Brand + product + variant, max 6 words, e.g. "Heinz Baked Beans".
                size:
                  type: string
                  description: Pack size, e.g. "400g", "330ml", "6 x 250ml", "10's".
                category:
                  type: string
                  enum: [Drinks, Tinned & Canned, Snacks & Confectionery, Bakery & Cereals, Home & Cleaning, Health & Beauty, Baby & Toddler, Pet, Electronics, Other]
                price:
                  type: number
                  description: Clearance selling price in rand (ZAR). Must come from the user.
                marketPrice:
                  type: number
                  description: Normal retail price in rand, if the user gave one. 0 if unknown.
                bestBefore:
                  type: string
                  description: Best-before date as YYYY-MM-DD, read from the pack or given by the user. Empty if none.
                barcode:
                  type: string
                  description: Barcode digits if readable on the pack. Empty if not.
                notes:
                  type: string
                  description: Short customer-facing description, 1-2 sentences.
                kosher:
                  type: boolean
                halal:
                  type: boolean
                vegan:
                  type: boolean
                openaiFileIdRefs:
                  type: array
                  description: 1-3 product photos from this chat. Front of pack first.
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      id: { type: string }
                      mime_type: { type: string }
                      download_link: { type: string }
      responses:
        '200':
          description: Product published
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  id: { type: string }
                  name: { type: string }
                  category: { type: string }
                  price: { type: number }
                  photoUrl: { type: string }
                  storeUrl: { type: string }
                  adminUrl: { type: string }
        '400':
          description: Missing or invalid details (the error message says which)
        '401':
          description: Wrong or missing API key
        '409':
          description: A product with this barcode is already in the store
